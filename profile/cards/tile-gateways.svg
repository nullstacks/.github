<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 190" width="232" height="190" role="img" aria-label="Model Gateways: kilo-gateway, opencode-gateway, cline2api, qoder2api"><title>Model Gateways: kilo-gateway, opencode-gateway, cline2api, qoder2api</title><style>
:root{--bg:#fbfaf6;--card:#ffffff;--ink:#17171a;--mute:#6b6b73;--line:#e3e0d6;
--blue:#2f6fed;--red:#e5484d;--amber:#c98100;--teal:#12a37f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#12171e;--ink:#ecebe6;--mute:#8b949e;--line:#262c36;
--blue:#6ea0ff;--red:#ff7b7f;--amber:#f5b942;--teal:#3ddbb0}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}.mute{fill:var(--mute)}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
.swing{transform-box:fill-box;transform-origin:50% 100%;animation:swing 1s cubic-bezier(.2,1.2,.3,1) var(--d,0s) backwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) var(--d,0s) backwards}
.fade{animation:fade .8s ease-out var(--d,0s) backwards}
.tick{opacity:0;animation:tick .13s linear var(--d,0s) both}
.final{animation:fade .3s ease-out var(--d,0s) backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out var(--d,0s) infinite}
.nudge{animation:nudge 2.6s ease-in-out var(--d,0s) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.orbit{opacity:.4;transform-box:fill-box;transform-origin:center;animation:orbit 3.6s linear var(--d,0s) infinite}
.zip{opacity:.4;transform-box:fill-box;transform-origin:center;animation:zip 4.2s linear var(--d,0s) infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes swing{from{opacity:0;transform:translateY(26px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes fade{from{opacity:0}}
@keyframes tick{0%,99%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes ring{0%{opacity:.5;transform:scale(.6)}70%,100%{opacity:0;transform:scale(2.2)}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes orbit{0%{opacity:1;transform:scale(1.18)}22%{opacity:.4;transform:scale(1)}100%{opacity:.4}}
@keyframes zip{0%{opacity:1;transform:scale(1.3)}14%{opacity:.4;transform:scale(1)}100%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{opacity:0}.orbit,.zip{opacity:1}}
</style><g class="swing" style="--d:1.00s"><rect x="1" y="1" width="230" height="188" rx="16" fill="var(--card)" stroke="var(--line)"/><rect x="1" y="1" width="230" height="6" rx="3" style="fill:var(--blue)"/><circle class="ring" style="--d:1.60s;stroke:var(--blue)" cx="202" cy="34" r="8" fill="none" stroke-width="2"/><circle cx="202" cy="34" r="4" style="fill:var(--blue)"/><text class="mono mute" x="20" y="38" font-size="10.5" letter-spacing="1.4">MODEL GATEWAYS</text><text class="tick serif" style="--d:1.45s;fill:var(--blue)" x="20" y="102" font-size="60" font-weight="700">0</text><text class="tick serif" style="--d:1.58s;fill:var(--blue)" x="20" y="102" font-size="60" font-weight="700">1</text><text class="tick serif" style="--d:1.71s;fill:var(--blue)" x="20" y="102" font-size="60" font-weight="700">2</text><text class="tick serif" style="--d:1.84s;fill:var(--blue)" x="20" y="102" font-size="60" font-weight="700">3</text><text class="final serif" style="--d:1.97s;fill:var(--blue)" x="20" y="102" font-size="60" font-weight="700">4</text><text class="mute" x="58" y="102" font-size="13">repos</text><text class="mono rise" style="--d:1.70s" x="20" y="128" font-size="11.5"><tspan class="mute">› </tspan>kilo-gateway</text><text class="mono rise" style="--d:1.78s" x="20" y="144" font-size="11.5"><tspan class="mute">› </tspan>opencode-gateway</text><text class="mono rise" style="--d:1.86s" x="20" y="160" font-size="11.5"><tspan class="mute">› </tspan>cline2api</text><text class="mono rise" style="--d:1.94s" x="20" y="176" font-size="11.5"><tspan class="mute">› </tspan>qoder2api</text><g class="nudge" style="--d:1.00s"><text x="198" y="174" font-size="18" style="fill:var(--blue)">↘</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 146" width="212" height="146" role="img" aria-label="Web Apps &amp; Tools: papersnap, curl-toolkit, jee, mai-image"><title>Web Apps &amp; Tools: papersnap, curl-toolkit, jee, mai-image</title><style>
:root{--bg:#fbfaf6;--card:#ffffff;--ink:#17171a;--mute:#6b6b73;--line:#e3e0d6;
--blue:#2f6fed;--red:#e5484d;--amber:#c98100;--teal:#12a37f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#12171e;--ink:#ecebe6;--mute:#8b949e;--line:#262c36;
--blue:#6ea0ff;--red:#ff7b7f;--amber:#f5b942;--teal:#3ddbb0}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}.mute{fill:var(--mute)}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
.swing{transform-box:fill-box;transform-origin:50% 100%;animation:swing 1s cubic-bezier(.2,1.2,.3,1) var(--d,0s) backwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) var(--d,0s) backwards}
.tick{opacity:0;animation:tick .13s linear var(--d,0s) both}
.final{animation:fade .3s ease-out var(--d,0s) backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out var(--d,0s) infinite}
.nudge{animation:nudge 2.6s ease-in-out var(--d,0s) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.orbit{animation:orbit 3.6s ease-in-out var(--d,0s) infinite}
.zip{animation:zip 1.2s ease-out var(--d,0s) infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes swing{from{opacity:0;transform:translateY(26px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes fade{from{opacity:0}}
@keyframes tick{0%,99%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes ring{0%{opacity:.5;transform:scale(.6)}70%,100%{opacity:0;transform:scale(2.2)}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes orbit{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes zip{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{opacity:0}.orbit,.zip{opacity:1}}
</style><g class="swing" style="--d:1.54s"><rect x="1" y="1" width="210" height="144" rx="13" fill="var(--card)" stroke="var(--line)"/><rect x="1" y="1" width="210" height="4.5" rx="2.25" style="fill:var(--teal)"/><circle class="ring" style="--d:2.14s;stroke:var(--teal)" cx="188" cy="28" r="6.5" fill="none" stroke-width="1.8"/><circle cx="188" cy="28" r="3.2" style="fill:var(--teal)"/><text class="mono mute" x="16" y="31" font-size="9" letter-spacing="1.1">WEB APPS &amp; TOOLS</text><text class="tick serif" data-cu="1" style="--d:1.99s;fill:var(--teal)" x="16" y="82" font-size="42" font-weight="700">0</text><text class="tick serif" data-cu="1" style="--d:2.12s;fill:var(--teal)" x="16" y="82" font-size="42" font-weight="700">1</text><text class="tick serif" data-cu="1" style="--d:2.25s;fill:var(--teal)" x="16" y="82" font-size="42" font-weight="700">2</text><text class="tick serif" data-cu="1" style="--d:2.38s;fill:var(--teal)" x="16" y="82" font-size="42" font-weight="700">3</text><text class="final serif" data-cu="1" style="--d:2.51s;fill:var(--teal)" x="16" y="82" font-size="42" font-weight="700">4</text><text class="mute" x="46" y="82" font-size="11">repos</text><text class="mono rise" style="--d:2.24s" x="16" y="101" font-size="10"><tspan class="mute">› </tspan>papersnap</text><text class="mono rise" style="--d:2.32s" x="16" y="115" font-size="10"><tspan class="mute">› </tspan>curl-toolkit</text><text class="mono rise" style="--d:2.40s" x="16" y="129" font-size="10"><tspan class="mute">› </tspan>jee</text><text class="mono mute" x="16" y="141" font-size="9">+1 more</text><g class="nudge" style="--d:1.54s"><text x="190" y="134" font-size="14" style="fill:var(--teal)">↘</text></g></g></svg>